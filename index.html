<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Next</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #111827; color: white; overflow: hidden; }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        .perspective-1000 { perspective: 1000px; }
        
        /* Initial Loader */
        .app-loader { position: fixed; inset: 0; background: #111827; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.1); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      // Global Error Handler to catch startup issues
      window.addEventListener('error', function(e) {
         console.error('Global Error:', e.error);
         const loader = document.querySelector('.app-loader');
         if (loader) {
             loader.innerHTML += '<div style="color:red; margin-top:10px; font-size:10px;">Runtime Error: ' + e.message + '</div>';
         }
      });
    </script>
<script type="importmap">
{
  "imports": {
    "rxjs": "https://esm.sh/rxjs@^7.8.2?conditions=es2015",
    "rxjs/operators": "https://esm.sh/rxjs@^7.8.2/operators?conditions=es2015",
    "rxjs/ajax": "https://esm.sh/rxjs@^7.8.2/ajax?conditions=es2015",
    "rxjs/webSocket": "https://esm.sh/rxjs@^7.8.2/webSocket?conditions=es2015",
    "rxjs/testing": "https://esm.sh/rxjs@^7.8.2/testing?conditions=es2015",
    "rxjs/fetch": "https://esm.sh/rxjs@^7.8.2/fetch?conditions=es2015",
    "@angular/compiler": "https://esm.sh/@angular/compiler@18.2.0?external=rxjs",
    "@angular/platform-browser": "https://esm.sh/@angular/platform-browser@18.2.0?external=rxjs",
    "@angular/core": "https://esm.sh/@angular/core@18.2.0?external=rxjs",
    "@angular/forms": "https://esm.sh/@angular/forms@18.2.0?external=rxjs",
    "@angular/common": "https://esm.sh/@angular/common@18.2.0?external=rxjs",
    "firebase/database": "https://esm.sh/firebase@^12.9.0/database?external=rxjs",
    "firebase/app": "https://esm.sh/firebase@^12.9.0/app?external=rxjs",
    "firebase/": "https://esm.sh/firebase@^12.9.0/"
  }
}
</script>
</head>
<body>
    <app-root>
        <div class="app-loader">
            <div class="spinner"></div>
            <div style="margin-top: 20px; font-weight: bold; color: #4b5563;">Loading Roblox Next...</div>
        </div>
    </app-root>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
